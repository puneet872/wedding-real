<!doctype html>
<!-- The WhatsApp / social preview picture (art/share.jpg), 1200 x 630.
     Open this page at exactly 1200 x 630 and take a screenshot to remake it.
     The names and the couple sit in the middle square, so the picture still
     reads when an app crops it to a square thumbnail. -->
<html lang="hi">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;600&family=Rozha+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #140A05; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url(../art/hero-venue.jpg) center 46% / cover no-repeat; filter: brightness(.62) saturate(1.1); }
  .shade { position: absolute; inset: 0;
    background: radial-gradient(60% 75% at 50% 62%, rgba(20, 10, 4, 0) 0%, rgba(20, 10, 4, .35) 70%, rgba(14, 6, 2, .75) 100%),
                linear-gradient(180deg, rgba(14, 6, 2, .72) 0%, rgba(14, 6, 2, .15) 38%, rgba(14, 6, 2, 0) 60%, rgba(14, 6, 2, .45) 100%); }
  .top { position: absolute; left: 0; right: 0; top: 26px; text-align: center; color: #F8EFE1; }
  .names { font: 400 92px/1.05 "Rozha One", serif; text-shadow: 0 3px 24px rgba(0, 0, 0, .6); letter-spacing: .5px; }
  .names small { font-size: .42em; color: #F2CF7A; vertical-align: .55em; margin: 0 .3em; }
  .date { font: 600 30px/1.2 "Eczar", serif; color: #F2CF7A; margin-top: 6px; text-shadow: 0 2px 12px rgba(0, 0, 0, .7); }
  .couple { position: absolute; left: 50%; bottom: -6px; height: 400px; transform: translateX(-50%); filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)); }
  .mono { position: absolute; width: 104px; top: 26px; left: 30px; opacity: .95; }
  .tag { position: absolute; right: 34px; bottom: 30px; font: 600 26px/1.25 "Eczar", serif; color: #F8EFE1; text-align: right; text-shadow: 0 2px 10px rgba(0, 0, 0, .8); }
  .tag b { display: block; font: 400 34px/1.1 "Rozha One", serif; color: #F2CF7A; }
  .tag.left { right: auto; left: 34px; text-align: left; }
</style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="shade"></div>
    <img class="mono" src="../art/monogram.webp" alt="">
    <div class="top">
      <div class="names">आशीष<small>संग</small>सपना</div>
      <div class="date">सोमवार, 30 नवम्बर 2026</div>
    </div>
    <img class="couple" src="../art/couple-varmala.webp" alt="">
    <div class="tag left"><b>शुभ विवाह</b>बैरीडीह, लालगंज, आजमगढ़</div>
    <div class="tag"><b>सादर आमंत्रण</b>तिलक · हल्दी · मेहंदी · बारात</div>
  </div>
</body>
</html>
